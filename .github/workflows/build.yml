name: Build

on:
  push:
    branches: [main, develop]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Allow the Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        if: runner.os != 'Linux'
        env:
          FETCHTV_E2E_SKIP_SSDP: ${{ runner.os != 'Linux' && '1' || '' }}
        run: npm run test:e2e

      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Build
        run: npm run dist -- --${{ matrix.platform }}

      - name: Add an orphaned package SID to the unpacked app folder (electron/electron#51761)
        if: runner.os == 'Windows'
        run: icacls "release\win-unpacked" /grant "*S-1-15-2-999-999-999:(OI)(CI)(F)"

      - name: Test that the unpacked app crashes without the grant and opens a window with it
        if: runner.os == 'Windows'
        env:
          FMR_E2E_ACL_REPRO: '1'
          FMR_E2E_ACL_EXPECT_CRASH: '1'
          FETCHTV_E2E_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\Fetch My Recordings.exe
        run: node --test --test-concurrency=1 --test-reporter=spec --test-name-pattern="ACL repro" test/startup.test.mjs

      - name: Add an inherited orphaned package SID to the per-user Programs folder
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Programs" | Out-Null
          icacls "$env:LOCALAPPDATA\Programs" /grant "*S-1-15-2-999-999-998:(OI)(CI)(F)"

      - name: Install silently and check the install folder access
        if: runner.os == 'Windows'
        run: |
          Start-Process -Wait -FilePath "release\Fetch-My-Recordings-Windows.exe" -ArgumentList '/S'
          $installDir = "$env:LOCALAPPDATA\Programs\fetch-my-recordings"
          icacls $installDir
          if (-not ((icacls $installDir) -match 'S-1-15-2-1:|ALL APPLICATION PACKAGES')) { throw 'The installer did not grant ALL APPLICATION PACKAGES read access.' }
          "FMR_INSTALLED_EXE=$installDir\Fetch My Recordings.exe" >> $env:GITHUB_ENV

      - name: Test that the installed app opens a window
        if: runner.os == 'Windows'
        env:
          FMR_E2E_ACL_REPRO: '1'
        run: |
          $env:FETCHTV_E2E_EXECUTABLE = $env:FMR_INSTALLED_EXE
          node --test --test-concurrency=1 --test-reporter=spec --test-name-pattern="ACL repro" test/startup.test.mjs

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetch-my-recordings-${{ matrix.platform }}
          path: |
            release/Fetch-My-Recordings-Mac.dmg
            release/Fetch-My-Recordings-Mac-Apple-Chip.dmg
            release/Fetch-My-Recordings-Mac-Intel.dmg
            release/Fetch-My-Recordings-Windows.exe
            release/Fetch-My-Recordings-Linux.AppImage
            release/Fetch-My-Recordings-Linux-ARM.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: builds
          merge-multiple: true

      - name: Attach the builds to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" \
                builds/Fetch-My-Recordings-Mac.dmg \
                builds/Fetch-My-Recordings-Mac-Apple-Chip.dmg \
                builds/Fetch-My-Recordings-Mac-Intel.dmg \
                builds/Fetch-My-Recordings-Windows.exe \
                builds/Fetch-My-Recordings-Linux.AppImage \
                builds/Fetch-My-Recordings-Linux-ARM.AppImage \
                --clobber
              gh release edit "$TAG" --draft=false --latest
              exit 0
            fi
            echo "No release for $TAG yet. Waiting a minute (attempt $attempt of 30)."
            sleep 60
          done
          echo "No release for $TAG after 30 minutes. Create it as a draft, then re-run this job."
          exit 1
