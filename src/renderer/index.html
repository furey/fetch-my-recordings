<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetch My Recordings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top" id="top">
    <button type="button" class="home" id="home" aria-label="Back to start">
      <img class="mark" src="mark.svg" width="36" height="36" alt="">
      <svg class="home-back" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="2"/><path d="M25 18H11M17 12l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="home-tip" aria-hidden="true">Back to start</span>
    </button>
    <ol class="steps" id="steps" aria-label="Steps">
      <li data-step="1"><span class="step"><span class="step-bar"></span><span class="step-label">Find your Fetch box</span></span></li>
      <li data-step="2"><span class="step"><span class="step-bar"></span><span class="step-label">Choose recordings</span></span></li>
      <li data-step="3"><span class="step"><span class="step-bar"></span><span class="step-label">Choose a folder</span></span></li>
      <li data-step="4"><span class="step"><span class="step-bar"></span><span class="step-label">Save</span></span></li>
    </ol>
  </header>
  <main id="view" tabindex="-1"></main>
  <div class="actions" id="actions"></div>
  <footer class="bottom">
    <span id="about-line">fetchtv</span>
    <span class="bottom-links">
      <button type="button" role="switch" class="toggle" id="sound-toggle" aria-checked="true"><span class="toggle-track"><span class="toggle-knob"></span></span><span>Sounds</span></button>
      <span id="footer-github"></span>
    </span>
  </footer>
  <dialog id="info-dialog" class="dialog" aria-labelledby="info-title">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 id="info-title"></h2>
        <button type="button" class="btn quiet" id="info-close">Close</button>
      </div>
      <div class="dialog-body" id="info-body" role="region" aria-labelledby="info-title"></div>
      <div class="dialog-foot" id="info-foot" hidden></div>
    </div>
  </dialog>
  <script src="sounds.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
</body>
</html>
